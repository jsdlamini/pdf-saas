name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  baseline-pixels:
    name: Baseline pixel renderer (Option B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/baseline/render-check.mjs

  redact-pixel:
    name: Redact pixel test (Playwright)
    runs-on: ubuntu-latest
    env:
      # Structurally-valid placeholder Clerk key (decodes to clerk.ci.example.com$)
      # so ClerkProvider passes its publishable-key validation. Public pages render
      # without auth; the redact test never signs in.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuY2kuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_Y2xlcmsuY2kuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Stop Next.js from prompting for telemetry consent on first run in CI
      # (non-interactive shells otherwise hang before the dev server binds).
      NEXT_TELEMETRY_DISABLED: "1"
      # Analytics is Postgres-backed; point it at a placeholder so the pool
      # constructor does not throw. The analytics route degrades to a 500.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/redact-pixel.spec.ts
