services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wiserfiles}
      POSTGRES_USER: ${POSTGRES_USER:-wiserfiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiserfiles}
    expose:
      - "5432"
    volumes:
      # Host bind mount keeps project/account data outside container lifecycle.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wiserfiles} -d ${POSTGRES_DB:-wiserfiles}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${WEB_IMAGE:-pdf-saas-web:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Passed into the build so next build can inline it into the client bundle.
        # Compose substitutes this from the project .env file.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    container_name: pdf-saas
    restart: unless-stopped
    # Non-root runtime; the Dockerfile sets USER app with scoped sudo for apt/tlmgr.
    user: "app"
    depends_on:
      db:
        condition: service_healthy
    # Bound to loopback only: nginx-proxy reaches this container by name over
    # webnet (TLS-terminated). Publishing on the host's public IP would expose
    # the app without TLS.
    ports:
      - "127.0.0.1:3000:3000"
    # Arbitrary user code (run-code, LaTeX) runs in this container, so cap it.
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # Persist uploaded project images (figures) outside the container.
      - ./data/assets:/app/data/assets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Keep database local to this compose stack for portability and isolation.
      DATABASE_URL: postgresql://${POSTGRES_USER:-wiserfiles}:${POSTGRES_PASSWORD:-wiserfiles}@db:5432/${POSTGRES_DB:-wiserfiles}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://pdf.idealsoftwaresolutions.com}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # DeepSeek configuration is read from host environment or project .env.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/chat/completions}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-WiserFiles <invites@idealsoftwaresolutions.com>}
    networks:
      - default
      - webnet

networks:
  # Shared external network (created outside this project). nginx-proxy lives
  # here and reverse-proxies pdf.idealsoftwaresolutions.com to the "pdf-saas"
  # container by name, so the web service MUST join it.
  webnet:
    external: true
    name: ${WEB_EXTERNAL_NETWORK:-docker_webnet}