services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papertrail}
      POSTGRES_USER: ${POSTGRES_USER:-papertrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papertrail}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papertrail} -d ${POSTGRES_DB:-papertrail}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Passed into the build so next build can inline it into the client bundle.
        # Compose substitutes this from the project .env file.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    container_name: pdf-saas
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://papertrail:papertrail@db:5432/papertrail}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # DeepSeek configuration is read from host environment or project .env.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/chat/completions}
    networks:
      - default
      - webnet

networks:
  # Shared external network (created outside this project). nginx-proxy lives
  # here and reverse-proxies pdf.idealsoftwaresolutions.com to the "pdf-saas"
  # container by name, so the web service MUST join it.
  webnet:
    external: true
    name: docker_webnet

volumes:
  postgres-data:
